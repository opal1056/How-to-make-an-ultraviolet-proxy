<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Page</title>
</head>
<body>
    <select id="switcher">
        <option value="epoxy">Epoxy</option>
        <option value="bare">Bare</option>
        <option value="libcurl">Libcurl</option>
    </select>
    
    <input type="text" id="wispInput" placeholder="WISP URL" aria-label="WISP URL">
    <input type="text" id="bareInput" placeholder="Bare URL" aria-label="Bare URL">
    
    <!-- Search Engine Selector -->
    <select id="searchEngineSelector">
        <option value="google">Google</option>
        <option value="bing">Bing</option>
        <option value="yahoo">Yahoo</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="ecosia">Ecosia</option>
    </select>

    <!-- Open Mode Selector -->
    <select id="openModeSelector">
        <option value="iframe">Open in Iframe</option>
        <option value="newTab">Open in New Tab</option>
        <option value="blankTab">Open in About:blank Tab</option>
    </select>
    
    <script src="index.js"></script>
</body>
</html>
